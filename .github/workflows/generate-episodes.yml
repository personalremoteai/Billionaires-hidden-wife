name: Generate episode batch
on:
  workflow_dispatch:
    inputs:
      start:
        description: First episode number (1–70)
        required: true
        default: '1'
      count:
        description: Number of episodes; keep batches small
        required: true
        default: '1'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-engine.txt
      - name: Generate scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python tools/production_engine.py --start '${{ inputs.start }}' --count '${{ inputs.count }}'
      - name: Commit generated scripts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/episode_outputs/
          if git diff --cached --quiet; then echo 'No new files to commit.'; else git commit -m 'Generate episode batch'; git push; fi
